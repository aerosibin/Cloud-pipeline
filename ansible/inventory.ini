# ============================================================
# Ansible Inventory — Microsoft Azure (AKS & Management VMs)
#
# Replace the ansible_host values with your actual Azure VM
# public IP addresses (from: az vm list-ip-addresses)
#
# Default admin user on Azure Linux VMs is usually: azureuser
# SSH key: ~/.ssh/id_rsa or your Azure SSH key
# ============================================================

[azure_jumpbox]
aks-jumpbox ansible_host=20.198.10.10 ansible_user=azureuser

[jenkins_server]
jenkins-vm ansible_host=20.198.10.5 ansible_user=azureuser

[k8s_nodes]
aks-node-1 ansible_host=20.198.10.11 ansible_user=azureuser
aks-node-2 ansible_host=20.198.10.12 ansible_user=azureuser

[all:vars]
ansible_ssh_private_key_file=~/.ssh/azure-key.pem
ansible_python_interpreter=/usr/bin/python3

# Azure Infrastructure Configuration
azure_resource_group=cloud-pipeline-rg
azure_region=centralindia
aks_cluster_name=cloud-pipeline-aks
acr_name=cloudpipelineacr
