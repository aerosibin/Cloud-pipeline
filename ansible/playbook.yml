---
# ============================================================
# Ansible Playbook: Azure Cloud Pipeline Infrastructure Setup
# Usage: ansible-playbook -i inventory.ini playbook.yml
# ============================================================

# ----------------------------------------------------------
# Play 1: Common setup on ALL nodes
# ----------------------------------------------------------
- name: Common Node Setup
  hosts: all
  become: true
  gather_facts: true

  roles:
    - common

  tasks:
    - name: Set system timezone to UTC
      community.general.timezone:
        name: UTC

    - name: Ensure /etc/environment has UTF-8 locale
      lineinfile:
        path: /etc/environment
        line: 'LANG=en_US.UTF-8'
        create: true

    - name: Update apt cache
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install common utility packages
      apt:
        name:
          - git
          - curl
          - wget
          - unzip
          - vim
          - htop
          - net-tools
          - ca-certificates
          - gnupg
          - lsb-release
          - apt-transport-https
        state: present

    - name: Print node info
      debug:
        msg: "Configured node: {{ inventory_hostname }} ({{ ansible_default_ipv4.address | default('N/A') }})"

# ----------------------------------------------------------
# Play 2: Azure CLI, Kubectl & Kubernetes Management Setup
# ----------------------------------------------------------
- name: Azure CLI and Kubernetes Management Node Setup
  hosts: azure_jumpbox, jenkins_server
  become: true
  gather_facts: true

  vars:
    k8s_namespace: cloud-pipeline
    k8s_manifests_dir: "{{ playbook_dir }}/../k8s"
    helm_version: "v3.14.0"

  tasks:
    # ── Install Microsoft package signing key & Azure CLI ──────
    - name: Create directory for keyrings
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Microsoft GPG key
      get_url:
        url: https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/apt/keyrings/microsoft.asc
        mode: '0644'

    - name: Add Microsoft Azure CLI repository
      apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.asc] https://packages.microsoft.com/repos/azure-cli/ {{ ansible_distribution_release }} main"
        state: present
        filename: azure-cli

    - name: Install Azure CLI
      apt:
        name: azure-cli
        state: present
        update_cache: true

    - name: Verify Azure CLI installation
      command: az version
      register: az_verify
      changed_when: false

    - name: Print Azure CLI version
      debug:
        msg: "{{ az_verify.stdout_lines }}"

    # ── Install Kubectl ───────────────────────────────────────
    - name: Install kubectl using az aks install-cli
      command: az aks install-cli
      args:
        creates: /usr/local/bin/kubectl

    # ── Authenticate Azure CLI (if Service Principal vars provided) ──
    - name: Login to Azure using Service Principal
      command: >
        az login --service-principal
        --username "{{ azure_client_id }}"
        --password "{{ azure_client_secret }}"
        --tenant "{{ azure_tenant_id }}"
      no_log: true
      when:
        - azure_client_id is defined
        - azure_client_secret is defined
        - azure_tenant_id is defined

    - name: Set active Azure subscription
      command: az account set --subscription "{{ azure_subscription_id }}"
      when: azure_subscription_id is defined

    # ── Fetch AKS cluster credentials ─────────────────────────
    - name: Fetch AKS cluster credentials
      command: >
        az aks get-credentials
        --resource-group {{ azure_resource_group }}
        --name {{ aks_cluster_name }}
        --overwrite-existing
      when:
        - azure_resource_group is defined
        - aks_cluster_name is defined

    # ── Install Helm ──────────────────────────────────────────
    - name: Download Helm install script
      get_url:
        url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
        dest: /tmp/get-helm-3.sh
        mode: '0700'

    - name: Install Helm {{ helm_version }}
      command: /tmp/get-helm-3.sh --version {{ helm_version }}
      args:
        creates: /usr/local/bin/helm

    - name: Verify Helm installation
      command: helm version --short
      register: helm_verify
      changed_when: false

    - name: Print Helm version
      debug:
        msg: "Helm version: {{ helm_verify.stdout }}"

    # ── Apply Kubernetes manifests ────────────────────────────
    - name: Create cloud-pipeline namespace
      command: kubectl apply -f {{ k8s_manifests_dir }}/namespace.yaml
      register: ns_result
      changed_when: "'created' in ns_result.stdout or 'configured' in ns_result.stdout"

    - name: Apply ConfigMap
      command: kubectl apply -f {{ k8s_manifests_dir }}/configmap.yaml -n {{ k8s_namespace }}
      register: cm_result
      changed_when: "'created' in cm_result.stdout or 'configured' in cm_result.stdout"

    - name: Apply Deployment
      command: kubectl apply -f {{ k8s_manifests_dir }}/deployment.yaml -n {{ k8s_namespace }}
      register: deploy_result
      changed_when: "'created' in deploy_result.stdout or 'configured' in deploy_result.stdout"

    - name: Apply Service
      command: kubectl apply -f {{ k8s_manifests_dir }}/service.yaml -n {{ k8s_namespace }}
      register: svc_result
      changed_when: "'created' in svc_result.stdout or 'configured' in svc_result.stdout"

    - name: Apply HPA
      command: kubectl apply -f {{ k8s_manifests_dir }}/hpa.yaml -n {{ k8s_namespace }}
      register: hpa_result
      changed_when: "'created' in hpa_result.stdout or 'configured' in hpa_result.stdout"

    - name: Apply Ingress
      command: kubectl apply -f {{ k8s_manifests_dir }}/ingress.yaml -n {{ k8s_namespace }}
      register: ingress_result
      changed_when: "'created' in ingress_result.stdout or 'configured' in ingress_result.stdout"

    - name: Wait for deployment rollout
      command: >
        kubectl rollout status deployment/cloud-pipeline-app
        -n {{ k8s_namespace }}
        --timeout=300s
      register: rollout_status
      changed_when: false

    - name: Print rollout status
      debug:
        msg: "{{ rollout_status.stdout }}"

# ----------------------------------------------------------
# Play 3: Verify all nodes are healthy
# ----------------------------------------------------------
- name: Verify Infrastructure Node Health
  hosts: all
  become: true
  gather_facts: true

  tasks:
    - name: Check system memory
      debug:
        msg: "Total memory: {{ ansible_memtotal_mb }} MB | Free: {{ ansible_memfree_mb }} MB"

    - name: Check system disk usage
      command: df -h /
      register: disk_usage
      changed_when: false

    - name: Print disk usage
      debug:
        msg: "{{ disk_usage.stdout_lines }}"

    - name: Ensure SSH service is running
      service:
        name: ssh
        state: started
        enabled: true

    - name: Confirm node status
      debug:
        msg: "Node {{ inventory_hostname }} ({{ ansible_default_ipv4.address | default('N/A') }}) is ready. OS: {{ ansible_distribution }} {{ ansible_distribution_version }}"
