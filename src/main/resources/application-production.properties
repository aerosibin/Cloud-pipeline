# Production profile overrides
# Activated when SPRING_PROFILES_ACTIVE=production (set in k8s/deployment.yaml)

# Reduce logging verbosity in production
logging.level.root=INFO
logging.level.com.cloudpipeline=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Structured log pattern for log aggregation tools (e.g., CloudWatch, ELK)
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %-5level [%thread] %logger{36} - %msg%n

# Actuator: keep probes enabled for Kubernetes liveness/readiness
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
