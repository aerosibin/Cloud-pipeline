spring.application.name=cloud-pipeline-app
server.port=8080

# Spring Boot Actuator - expose health and info endpoints
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Application info (surfaced by /info and /actuator/info)
info.app.name=Cloud Pipeline Demo App
info.app.version=1.0.1
info.app.description=End-to-End CI/CD Pipeline Demo Application

# Active profile (overridden by environment variable SPRING_PROFILES_ACTIVE)
spring.profiles.active=default

# Logging
logging.level.root=INFO
logging.level.com.cloudpipeline=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
