apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-pipeline-app-ingress
  namespace: cloud-pipeline
  labels:
    app: cloud-pipeline-app
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # Azure Application Gateway Ingress or NGINX Ingress on AKS
    # appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cloud-pipeline.example.com
      secretName: cloud-pipeline-tls
  rules:
    - host: cloud-pipeline.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloud-pipeline-app-service
                port:
                  number: 80
